<!-- Settings for the exported (new) environment system. Hidden when "Legacy" is selected. -->
<div id="environmentVisualsSettings">
	<div class="toggleButtons" style="display: flex; flex-direction: column; justify-content: space-between">
		<div class="toggleButton" title="Distance fog — dims and hazes far away lights and structure.">
			<label class="switch">
				<input type="checkbox" id="environmentFog" />
				<span class="slider round"></span>
			</label>
			<label class="toggleButtonLabel">
				<td>
					<nobr>Fog</nobr>
				</td>
			</label>
		</div>

		<div class="toggleButton" title="Screen bloom — the wide glow around lights.">
			<label class="switch">
				<input type="checkbox" id="environmentBloom" />
				<span class="slider round"></span>
			</label>
			<label class="toggleButtonLabel">
				<td>
					<nobr>Bloom</nobr>
				</td>
			</label>
		</div>

		<label style="display: flex" title="Floor reflection quality.">
			<div class="toggleButtonContainer">
				<label class="toggleButtonLabel" style="margin-left: 5px; top: 0; width: unset"
					><td><nobr>Mirrors:</nobr></td></label
				>
			</div>
			<select id="environmentMirror" class="settingButton" style="margin-left: 5px; margin-bottom: 5px; font-size: 0.7em">
				<option value="off">Off</option>
				<option value="low">Low</option>
				<option value="middle">Middle</option>
				<option value="high">High</option>
			</select>
		</label>
	</div>
</div>

<!-- Legacy stage settings. Only applicable (and only shown) when the "Legacy" environment is selected. -->
<div id="legacyVisualsSettings" style="display: none">
	<div class="toggleButton" style="border-bottom: 1px solid white; margin-bottom: 4px" title="Disable color changes, rotations, sparks, etc.">
		<label class="switch">
			<input type="checkbox" id="noEffects" />
			<span class="slider round"></span>
		</label>
		<label class="toggleButtonLabel">
			<td>
				<nobr>Disable events</nobr>
			</td>
		</label>
	</div>

	<div class="generalSettingsContainer">
		<div class="toggleButtons" style="display: flex; flex-direction: column; justify-content: space-between">
			<div class="toggleButton" title="Display lasers on the back.">
				<label class="switch">
					<input type="checkbox" id="showLasers" />
					<span class="slider round"></span>
				</label>
				<label class="toggleButtonLabel">
					<td>
						<nobr>Lasers</nobr>
					</td>
				</label>
			</div>

			<div class="toggleButton" title="Display twisting animation.">
				<label class="switch">
					<input type="checkbox" id="showTwister" />
					<span class="slider round"></span>
				</label>
				<label class="toggleButtonLabel">
					<td>
						<nobr>Twister</nobr>
					</td>
				</label>
			</div>

			<div class="toggleButton" title="Display columns to the sides.">
				<label class="switch">
					<input type="checkbox" id="showAudioColumns" />
					<span class="slider round"></span>
				</label>
				<label class="toggleButtonLabel">
					<td>
						<nobr>Audio columns</nobr>
					</td>
				</label>
			</div>
		</div>

		<div class="toggleButtons" style="display: flex; flex-direction: column; justify-content: space-between">
			<div class="toggleButton" title="Display platform on the front.">
				<label class="switch">
					<input type="checkbox" id="showPlatform" />
					<span class="slider round"></span>
				</label>
				<label class="toggleButtonLabel">
					<td>
						<nobr>Platform</nobr>
					</td>
				</label>
			</div>

			<div class="toggleButton" title="Display floor.">
				<label class="switch">
					<input type="checkbox" id="showFloor" />
					<span class="slider round"></span>
				</label>
				<label class="toggleButtonLabel">
					<td>
						<nobr>Floor</nobr>
					</td>
				</label>
			</div>

			<div class="toggleButton" title="Lights!">
				<label class="switch">
					<input type="checkbox" id="showLight" />
					<span class="slider round"></span>
				</label>
				<label class="toggleButtonLabel">
					<td>
						<nobr>Light</nobr>
					</td>
				</label>
			</div>
		</div>
	</div>
</div>
